versioning:
  scheme: unversioned-path
  current: null
  docs: https://www.opensanctions.org/docs/data/changes/
  note: >-
    The hosted API is NOT versioned in the URI — https://api.opensanctions.org has no
    /v1/ segment and the OpenAPI carries no info.version discriminator for the HTTP
    contract. Stability is managed by announced change windows rather than parallel
    versions. The SELF-HOSTED product (yente) does use semantic versioning, and each
    major version has "a service life of one year".
deprecation:
  policy_url: https://www.opensanctions.org/docs/data/changes/
  sunset_header: false
  deprecation_header: false
  notice_periods:
    - surface: hosted API deprecations
      notice: 3 months prior to effective date
    - surface: data-model property/entity-type name changes
      notice: 3 months
    - surface: data-model removals
      notice: 3 months prior to effective date
    - surface: export format changes
      notice: 3 months prior to effective date
    - surface: dataset removal
      notice: 2 months prior (except where required by law)
    - surface: self-hosted API (yente)
      notice: tied to a major semantic version change; one-year service life per major
  announcement_channels:
    - https://www.opensanctions.org/changelog/
    - https://www.opensanctions.org/changelog/rss/
    - https://www.opensanctions.org/newsletter/
  note: >-
    A genuinely strong policy — dated, per-surface, and forward-published. What is
    missing is the RUNTIME signal: no RFC 8594 Sunset or Deprecation response header
    is emitted, so a deprecation is only discoverable by a human reading the
    changelog, never by the client that is calling the deprecated thing.
