non_error_conditions:
  - status: 304
    title: The catalog has not changed
    source_operations: [catalog_catalog_get]
    note: >-
      Conditional GET. /catalog returns an ETag and `cache-control: public,
      max-age=300`; send If-None-Match to avoid re-downloading ~1.7 MB.
  - status: 308
    title: The entity was merged into another ID
    source_operations:
      - fetch_entity_entities__entity_id__get
      - Fetch_Adjacent_Entities__entities__entity_id__adjacent_get
      - Fetch_Adjacent_by_Property__entities__entity_id__adjacent__property_name__get
    note: >-
      De-duplication is visible in the protocol: a stored entity ID that was merged
      permanently redirects to its canonical ID. Clients that do not follow 308
      will silently lose the record.
client_error_mapping:
  source: >-
    https://raw.githubusercontent.com/opensanctions/yente-client/refs/heads/main/python/README.md
  library: yente-client
  exceptions:
    - {exception: BadRequestError, status: '400'}
    - {exception: AuthenticationError, status: '401, 403'}
    - {exception: NotFoundError, status: '404'}
    - {exception: RateLimitError, status: '429', note: carries .retry_after when set}
    - {exception: ServerError, status: '5xx'}
    - {exception: APIError, status: other, note: carries .status_code and .detail}
    - {exception: TransportError, status: network failure before the request reached the server}
  retries: >-
    "Retries are not built in — failed requests raise; callers handle backoff."
  cli_exit_codes:
    - {code: 0, meaning: one or more results}
    - {code: 1, meaning: zero results}
    - {code: 2, meaning: usage error (bad flag, unknown schema/property)}
    - {code: 3, meaning: API error (4xx, 5xx)}
    - {code: 4, meaning: network/transport error}
