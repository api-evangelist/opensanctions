    schema: ErrorResponse
    source_operations:
      - match_match__dataset__post
      - search_search__dataset__get
      - reconcile_reconcile__dataset__get
    remediation: Correct the query syntax, dataset scope, or filter arguments.
  - status: 401
    title: No API key provided
    schema: ErrorResponse
    observed_body: '{"detail":"No API key provided."}'
    source_operations: [observed live, not declared in the spec]
    remediation: >-
      Send `Authorization: ApiKey <key>`. NOT DECLARED IN THE OPENAPI — the 401 is
      real (probed 2026-08-27 on GET /search/default) but no operation lists it.
  - status: 403
    title: Authorization error
    schema: ErrorResponse
    source_operations: [force_update_updatez_post]
    remediation: >-
