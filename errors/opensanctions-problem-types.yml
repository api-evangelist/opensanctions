envelope:
  content_type: application/json
  shape: '{"detail": "<human-readable message>"}'
  schema: ErrorResponse
  rfc9457: false
  note: >-
    NOT RFC 9457 problem+json. The API is FastAPI-generated and returns the
    framework's `{"detail": ...}` envelope with content-type application/json.
    Validation failures (422) use the richer FastAPI HTTPValidationError shape,
    a `detail[]` array of {loc, msg, type} objects — so the envelope is not even
    internally consistent between 4xx classes.
