standards:
  - id: openapi-3.1
    conforms: true
    evidence: >-
      openapi: 3.1.0 served at https://api.opensanctions.org/openapi.json (200,
      application/json, 12 paths, 42 component schemas).
  - id: reconciliation-service-api
    conforms: true
    domain_standard: true
    evidence: >-
      GET /reconcile/{dataset} (operationId reconcile_reconcile__dataset__get)
      returns a FreebaseManifest, with FreebaseManifestSuggest / -Preview / -View /
      -Extend / -ExtendPropertySetting / FreebaseType component schemas. That is the
      W3C Entity Reconciliation CG Reconciliation Service API manifest shape
      (OpenRefine's "Freebase" lineage), declared in the CONTRACT rather than
      claimed on a page.
    spec_location: '#/paths/~1reconcile~1{dataset}/get and #/components/schemas/FreebaseManifest'
    significance: >-
      This is the domain-standard signature for this market: any OpenRefine, Wikidata
      or reconciliation-aware client can point at OpenSanctions with no bespoke
      connector.
  - id: followthemoney
    conforms: true
    domain_standard: true
    evidence: >-
      Every entity payload is a FollowTheMoney entity — EntityResponse carries
      schema/properties/datasets/referents/target/first_seen/last_seen/last_change,
      and the schema vocabulary (Person, Company, Vessel, Organization, ...) is the
      FtM ontology. FtM is stewarded by OpenSanctions itself
      (github.com/opensanctions/followthemoney) and is the de-facto interchange
      format for anti-corruption / financial-crime data, with Python, TypeScript and
      JVM bindings.
    spec_location: '#/components/schemas/EntityResponse'
