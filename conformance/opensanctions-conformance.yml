    conforms: true
    domain_standard: true
    evidence: >-
      A first-party Senzing entity-resolution export is published as a bulk data
      format (https://www.opensanctions.org/docs/bulk/senzing/), letting a Senzing
      deployment ingest the dataset without a mapping layer. Bulk-data surface, not
      an API endpoint.
  - id: w3c-trace-context
    conforms: true
    evidence: >-
      Live responses carry `traceparent: 00-<trace-id>-<span-id>-00` and
