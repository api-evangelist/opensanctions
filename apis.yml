aid: opensanctions
name: OpenSanctions
description: >-
  OpenSanctions is an open database of international sanctions, watchlists, criminal
  designations and politically exposed persons (PEPs), published as a screening API,
  bulk data downloads and MIT-licensed open-source software from Berlin. It
  consolidates hundreds of primary government sources — OFAC, the EU consolidated
  list, UN Security Council, UK FCDO, procurement debarment registers, regulatory
  enforcements and national PEP registers — into a single de-duplicated entity graph
  expressed in the FollowTheMoney ontology it stewards. The hosted Screening API at
  api.opensanctions.org offers query-by-example entity matching with scored,
  per-feature explanations, free-text search, entity fetch with relationship
  traversal, statement-level provenance for every asserted value, and an OpenRefine
  reconciliation manifest. It is used for customer due diligence, transaction
  monitoring, supply-chain and vessel screening, KYB, and investigative journalism.
  The dataset is free for non-commercial use under CC BY-NC 4.0; commercial use is
  licensed, and the API is metered at EUR 0.10 per query.
